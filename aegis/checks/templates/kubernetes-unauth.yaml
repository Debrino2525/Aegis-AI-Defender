id: AEGIS-TMPL-005
name: Kubernetes API Server Unauthenticated Access
description: >
  The Kubernetes API server is accessible without authentication. This allows
  an attacker to list pods, deploy malicious workloads, exfiltrate secrets,
  and fully compromise the cluster. This is one of the most critical cloud
  misconfigurations in modern infrastructure.
severity: CRITICAL
cvss: 10.0
epss: 0.96
tags: [kubernetes, k8s, cloud, unauthenticated, rce]
checks:
  - type: http_response
    port: 8080
    path: /api/v1/namespaces
    method: GET
    status: [200]
    contains: "namespaces"
    evidence: "Kubernetes API /api/v1/namespaces returned 200 without authentication on port 8080"
  - type: http_response
    port: 6443
    path: /api/v1/namespaces
    method: GET
    status: [200]
    contains: "namespaces"
    evidence: "Kubernetes API /api/v1/namespaces returned 200 without authentication on port 6443"
remediation: >
  1. Disable the insecure API server port (--insecure-port=0).
  2. Enable RBAC authorization (--authorization-mode=RBAC).
  3. Require authentication for all API access.
  4. Use network policies to restrict API server access.
references:
  - https://kubernetes.io/docs/concepts/security/
  - https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Kubernetes_Hardening_Guidance_1.0_508.pdf
