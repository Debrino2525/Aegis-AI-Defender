id: AEGIS-TMPL-001
name: Redis Unauthenticated Access
description: >
  Redis is accessible without authentication. An unauthenticated attacker can
  read/write all database keys, execute Lua scripts, and in some configurations
  achieve remote code execution via slave replication or cron job injection.
severity: CRITICAL
cvss: 9.8
epss: 0.92
tags: [redis, database, unauthenticated, rce]
checks:
  - type: tcp_banner
    port: 6379
    send: "PING"
    contains: "+PONG"
    evidence: "Redis PING responded with +PONG without any authentication required"
remediation: >
  1. Set 'requirepass <strong_password>' in redis.conf.
  2. Bind Redis to 127.0.0.1 only (bind 127.0.0.1).
  3. Use firewall rules to block external access to port 6379.
references:
  - https://redis.io/docs/manual/security/
  - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
